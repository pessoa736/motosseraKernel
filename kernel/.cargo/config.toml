[build]
target = "x86_64-unknown-none"
target-applies-to-host = false

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static"
]

[profile.release.build-override]
codegen-units = 1
opt-level = 0

[profile.dev.build-override]
opt-level = 0