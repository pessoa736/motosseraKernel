[package]
name = "motossera-kernel"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
limine = "0.6.3"
linked_list_allocator = "0.10"
nalgebra = { version = "0.35.0", default-features = false, features = ["alloc"] }
embedded-time = { version = "0.12", default-features = false }
naive-timer = "0.2"
spin = { version = "0.12.1"}
rhai = { version = "1.25", default-features = false, features = ["no_std", "no_module"] }

[build-dependencies]
cc = "1.0" 